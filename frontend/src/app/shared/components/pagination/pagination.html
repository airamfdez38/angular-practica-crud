<div class="pagination">

  <button (click)="loadPage(meta.currentPage - 1)" [disabled]="meta.currentPage === 1">
    Anterior
  </button>

  @for (page of [].constructor(meta.totalPages); track $index) {
  <button (click)="loadPage($index + 1)" [class.active]="meta.currentPage === ($index + 1)">
    {{ $index + 1 }}
  </button>
  }

  <button (click)="loadPage(meta.currentPage + 1)" [disabled]="meta.currentPage === meta.totalPages">
    Siguiente
  </button>

</div>
