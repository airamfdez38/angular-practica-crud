<div class="pagination">

  <button (click)="loadPage(meta.currentPage - 1)" [disabled]="meta.currentPage === 1">
    Anterior
  </button>

  @for (page of pages; track page) {
    <button (click)="loadPage(page)" [class.active]="meta.currentPage === page">
      {{ page }}
    </button>
  }

  <button (click)="loadPage(meta.currentPage + 1)" [disabled]="meta.currentPage === meta.totalPages">
    Siguiente
  </button>

</div>
