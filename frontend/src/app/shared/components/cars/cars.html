<table class="table">
  <thead>
    <tr>
      <th>Marca</th>
      <th>Modelo</th>
      <th>Total</th>
    </tr>
  </thead>
  <tbody>
    @for(car of cars; track $index){
    <tr>
      <td>{{car.brand.name}}</td>
      <td>{{car.model.name}}</td>
      <td>{{car.total}}</td>
    </tr>
    }
  </tbody>
</table>
<app-pagination
  [meta]="meta"
  (pageChanged)="loadPage($event)">
</app-pagination>
